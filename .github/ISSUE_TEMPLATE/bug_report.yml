name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. This form is for the package
        in *this* repository. You don't need to name it below.

        Found a security vulnerability instead? Do not open a public issue.
        Prefer this repository's own **Security → Report a vulnerability**
        button, if it has one. Otherwise use the
        [org-wide fallback](https://github.com/EmergentMatter/actions/security/advisories/new)
        and name the affected package.

  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `pip show <package>` (or `uv pip show <package>`).
      placeholder: e.g. 1.4.2
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem you ran into.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet or sequence of steps that reproduces this.
      render: python
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.12.4
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14.5, Ubuntu 22.04, Windows 11
    validations:
      required: false

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual behavior
      description: What you expected to happen, and what happened instead.
    validations:
      required: false
